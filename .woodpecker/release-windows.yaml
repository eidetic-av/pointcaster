# Windows release build, triggered by pushing a version tag e.g.:
#
#   git tag v0.2.2 && git push origin v0.2.2
#

when:
  - event: tag

labels:
  platform: windows/amd64

variables:
  - &container_env
    POINTCASTER_DEV_IMAGE: cr.pointcaster.net/pointcaster-dev:2026-07-26-windows
    POINTCASTER_BUILD_VOLUME: pointcaster-ci-build
    DOCKER_HOST: npipe:////./pipe/dockerDesktopWindowsEngine

steps:
  - name: prepare
    image: pwsh
    environment: *container_env
    commands:
      - |
        $cmakelists = Get-Content -Raw CMakeLists.txt
        $found = [regex]::Match($cmakelists, "project\(pointcaster VERSION ([^ )]+)")
        if (-not $found.Success) {
          throw "could not read the project version out of CMakeLists.txt"
        }
        $version = $found.Groups[1].Value
        $tag = $env:CI_COMMIT_TAG -replace "^v", ""
        if ($tag -ne $version) {
          throw "tag $env:CI_COMMIT_TAG does not match CMakeLists.txt version ${version}: bump project(pointcaster VERSION ...) and re-tag"
        }
        Write-Host "releasing pointcaster $version"
      - |
        if (docker images --quiet $env:POINTCASTER_DEV_IMAGE) {
          Write-Host "$env:POINTCASTER_DEV_IMAGE is already on this agent"
        } else {
          Write-Host "pulling $env:POINTCASTER_DEV_IMAGE, this takes a while"
          docker pull $env:POINTCASTER_DEV_IMAGE
          if ($LASTEXITCODE -ne 0) { throw "could not pull $env:POINTCASTER_DEV_IMAGE" }
        }
      - |
        docker volume rm --force $env:POINTCASTER_BUILD_VOLUME
        if ($LASTEXITCODE -ne 0) { throw "could not reset $env:POINTCASTER_BUILD_VOLUME" }

  - name: configure
    image: pwsh
    environment: *container_env
    commands:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-in-windows-container.ps1 cmake --preset windows-release

  - name: build
    image: pwsh
    environment: *container_env
    commands:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-in-windows-container.ps1 cmake --build build/windows-release

  - name: package-and-deploy
    image: pwsh
    environment:
      POINTCASTER_DEV_IMAGE: cr.pointcaster.net/pointcaster-dev:2026-07-26-windows
      POINTCASTER_BUILD_VOLUME: pointcaster-ci-build
      DOCKER_HOST: npipe:////./pipe/dockerDesktopWindowsEngine
      DEPLOY_BRANCH: qt
      B2_APPLICATION_KEY_ID:
        from_secret: b2_application_key_id
      B2_APPLICATION_KEY:
        from_secret: b2_application_key
    commands:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-in-windows-container.ps1 cmake --build build/windows-release --target deploy
